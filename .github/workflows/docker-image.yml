name: Docker Image CI

# Baut das Image bei jedem Push auf master und veröffentlicht es als :latest.
# Pull Requests werden nur gebaut, damit ungeprüfter Code nie als :latest bei automatischen Updates landet.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest
          docker build -t $IMAGE_NAME .
          echo "Built $IMAGE_NAME"

      - name: Push Docker image
        # Nur aus master, auch beim Start von Hand
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest
          docker push $IMAGE_NAME
